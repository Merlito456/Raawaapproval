{% extends "base.html" %}

{% block title %}Verify RAAWA{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-search"></i> Verify RAAWA</h4>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="verification_type" class="form-label">Verification Type</label>
                    <select class="form-select" id="verification_type" onchange="toggleVerification()">
                        <option value="raawa">RAAWA No.</option>
                        <option value="esignature">ESig Reference No.</option>
                    </select>
                </div>
                
                <div id="raawa_verification">
                    <div class="mb-3">
                        <label for="raawa_no" class="form-label">RAAWA Number</label>
                        <input type="text" class="form-control" id="raawa_no" placeholder="e.g., MIN-20240101-0001">
                    </div>
                    <button class="btn btn-primary" onclick="verifyRAAWA()">
                        <i class="fas fa-search"></i> Verify
                    </button>
                </div>
                
                <div id="esignature_verification" style="display:none;">
                    <div class="mb-3">
                        <label for="esig_ref" class="form-label">ESig Reference No.</label>
                        <input type="text" class="form-control" id="esig_ref" placeholder="Enter ESig Reference No.">
                    </div>
                    <button class="btn btn-primary" onclick="verifyESignature()">
                        <i class="fas fa-search"></i> Verify
                    </button>
                </div>
                
                <div id="result" class="mt-4"></div>
            </div>
        </div>
    </div>
</div>

<script>
function toggleVerification() {
    const type = document.getElementById('verification_type').value;
    document.getElementById('raawa_verification').style.display = type === 'raawa' ? 'block' : 'none';
    document.getElementById('esignature_verification').style.display = type === 'esignature' ? 'block' : 'none';
    document.getElementById('result').innerHTML = '';
}

function verifyRAAWA() {
    const raawaNo = document.getElementById('raawa_no').value.trim();
    if (!raawaNo) {
        alert('Please enter RAAWA number');
        return;
    }
    
    fetch('/verify_raawa', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `raawa_no=${encodeURIComponent(raawaNo)}`
    })
    .then(response => response.json())
    .then(data => {
        const resultDiv = document.getElementById('result');
        if (data.found) {
            resultDiv.innerHTML = `
                <div class="alert alert-success">
                    <h5><i class="fas fa-check-circle"></i> RAAWA Found</h5>
                    <p><strong>Status:</strong> <span class="badge bg-${data.status === 'approved' ? 'success' : 'warning'}">${data.status}</span></p>
                    <p><strong>Requisitioner:</strong> ${data.requisitioner}</p>
                    <p><strong>Region:</strong> ${data.region}</p>
                    <p><strong>Created:</strong> ${data.created_at}</p>
                    <p><strong>Facility Manager:</strong> ${data.facility
