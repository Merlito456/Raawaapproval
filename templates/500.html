{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="display-1 text-muted">500</div>
            <h1 class="display-4">Server Error</h1>
            <p class="lead">Something went wrong on our end. Please try again later.</p>
            <p class="text-muted">We've been notified and are working on fixing this issue.</p>
            <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-primary">
                <i class="fas fa-home"></i> Go to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
